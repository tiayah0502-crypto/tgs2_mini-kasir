
name: Build Kasir EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile C++ for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Find C++ source files
        id: source
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.cpp -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/](\.git|build|\.github)[\\/]'
            }

          if (-not $files) {
            throw "Tidak ditemukan file .cpp di repository."
          }

          $files.FullName | ForEach-Object { Write-Host $_ }

      - name: Compile EXE
        shell: msys2 {0}
        run: |
          mapfile -t SOURCES < <(
            find . -type f -name '*.cpp' \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -not -path './build/*'
          )

          if [ ${#SOURCES[@]} -eq 0 ]; then
            echo "File .cpp tidak ditemukan!"
            exit 1
          fi

          mkdir -p build

          g++ -std=c++17 -O2 "${SOURCES[@]}" \
            -o build/kasir.exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasir-windows-exe
          path: build/kasir.exe
          if-no-files-found: error
          retention-days: 14
