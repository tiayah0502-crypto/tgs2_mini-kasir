
name: Build Kasir EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C++ compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Find source files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Filter *.cpp |
            Where-Object {
              $_.FullName -notmatch '[\\/](\.git|\.github|build)[\\/]'
            }

          if (-not $files) {
            throw "Tidak ditemukan file .cpp. Periksa isi repository."
          }

          Write-Host "File C++ yang ditemukan:"
          $files | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Compile program
        shell: msys2 {0}
        run: |
          set -e

          mapfile -t SOURCES < <(
            find . -type f -name '*.cpp' \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -not -path './build/*'
          )

          if [ ${#SOURCES[@]} -eq 0 ]; then
            echo "Tidak ada file C++."
            exit 1
          fi

          mkdir -p build

          g++ -std=c++17 -O2 \
            "${SOURCES[@]}" \
            -o build/kasir.exe

          test -f build/kasir.exe
          echo "Build berhasil: build/kasir.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: kasir-windows-exe
          path: build/kasir.exe
          if-no-files-found: error
          retention-days: 14
