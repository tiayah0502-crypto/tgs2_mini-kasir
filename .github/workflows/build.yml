name: Build Kasir EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MinGW Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Find C++ Source
        id: source
        shell: bash
        run: |
          if [ -f "tgs2_cpp.cpp" ]; then
            echo "file=tgs2_cpp.cpp" >> "$GITHUB_OUTPUT"
          elif [ -f "tgs2_cpp" ]; then
            echo "file=tgs2_cpp" >> "$GITHUB_OUTPUT"
          elif [ -f "main.cpp" ]; then
            echo "file=main.cpp" >> "$GITHUB_OUTPUT"
          else
            echo "File sumber C++ tidak ditemukan!"
            exit 1
          fi

      - name: Compile to EXE
        run: |
          x86_64-w64-mingw32-g++ \
            -x c++ \
            -std=c++17 \
            -Wall \
            -Wextra \
            "${{ steps.source.outputs.file }}" \
            -o kasir.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Kasir-EXE
          path: kasir.exe
          if-no-files-found: error
